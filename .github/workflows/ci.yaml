name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: arc-runner-portfolio
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Kaniko
        run: |
          curl -sSL -o /usr/local/bin/kaniko \
            https://github.com/GoogleContainerTools/kaniko/releases/download/v1.23.2/executor-linux-amd64
          chmod +x /usr/local/bin/kaniko

      - name: Authenticate to GHCR
        run: |
          mkdir -p /kaniko/.docker
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' \
            "$(printf '%s:%s' '${{ github.actor }}' '${{ secrets.GITHUB_TOKEN }}' | base64 -w0)" \
            > /kaniko/.docker/config.json

      - name: Build and push
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            EXTRA_FLAGS="--no-push"
          else
            EXTRA_FLAGS="--destination ghcr.io/${{ github.repository }}:main"
          fi
          /usr/local/bin/kaniko \
            --context="${{ github.workspace }}" \
            --dockerfile="${{ github.workspace }}/Dockerfile" \
            --destination="ghcr.io/${{ github.repository }}:${SHORT_SHA}" \
            ${EXTRA_FLAGS}
