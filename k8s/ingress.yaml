apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: portfolio
  namespace: portfolio
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`www.gaelrozario.com`) || Host(`gaelrozario.com`)
      kind: Rule
      services:
        - name: portfolio
          port: 80
  tls:
    certResolver: letsencrypt   # adjust to your Traefik certResolver name
