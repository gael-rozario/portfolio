name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: arc-runner-portfolio
    permissions: write-all
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get latest image tag
        id: version
        run: |
          TAG=$(git tag --sort=-v:refname | grep -v '^chart-' | head -1)
          echo "tag=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Deploy
        run: |
          helm upgrade --install portfolio charts/portfolio \
            --set image.tag=${{ steps.version.outputs.tag }} \
            --namespace portfolio \
            --wait
