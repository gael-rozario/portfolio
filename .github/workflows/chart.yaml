name: Chart

on:
  push:
    branches: [main]
    paths:
      - 'charts/**'
    paths-ignore:
      - '.github/**'

jobs:
  tag:
    runs-on: arc-runner-portfolio
    permissions: write-all
    outputs:
      new_tag: ${{ steps.bump.outputs.new_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Bump chart version and push tag
        id: bump
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false
          tag_prefix: chart-v

  publish:
    runs-on: arc-runner-portfolio
    permissions: write-all
    needs: tag
    if: ${{ needs.tag.outputs.new_tag != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Update chart versions
        run: |
          VERSION=${{ needs.tag.outputs.new_tag }}
          sed -i "s/^version:.*/version: ${VERSION#chart-v}/" charts/portfolio/Chart.yaml

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username ${{ github.actor }} \
            --password-stdin

      - name: Package and push chart
        run: |
          helm package charts/portfolio
          helm push portfolio-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
