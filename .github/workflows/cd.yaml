name: CD

on:
  workflow_run:
    workflows: [CI, Chart]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (e.g. 0.1.0)'
        required: false
      chart:
        description: 'Chart version to deploy (e.g. 0.1.0)'
        required: false

jobs:
  deploy:
    runs-on: arc-runner-portfolio
    permissions: write-all
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get versions
        id: version
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            TAG=$(git tag --sort=-v:refname | grep -v '^chart-' | head -1)
            echo "tag=${TAG#v}" >> $GITHUB_OUTPUT
          fi
          if [ -n "${{ inputs.chart }}" ]; then
            echo "chart=${{ inputs.chart }}" >> $GITHUB_OUTPUT
          else
            CHART_TAG=$(git tag --sort=-v:refname | grep '^chart-' | head -1)
            echo "chart=${CHART_TAG#chart-v}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username ${{ github.actor }} \
            --password-stdin

      - name: Deploy
        run: |
          helm upgrade --install portfolio \
            oci://ghcr.io/${{ github.repository_owner }}/charts/portfolio \
            --version ${{ steps.version.outputs.chart }} \
            --set image.tag=${{ steps.version.outputs.tag }} \
            --namespace portfolio \
            --wait
