name: First workflow to print Dockerfile

on:
  - push

jobs:
  ReadDockerfile:
    runs-on: arc-runner-portfolio
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Dragon say hello
        run: |
          ls -al
          cat Dockerfile
          apt-get update
          apt-get install cowsay
          cowsay -f dragon "hello, world"
